name: Package OpenRR OptiScaler Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Optional custom zip stem (leave empty for OpenRR-v<version>-OptiScaler)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ubuntu:26.04
    defaults:
      run:
        shell: bash
    env:
      OPENRR_BUILD_JOBS: '4'

    steps:
      - name: Install core build toolchain dependencies
        timeout-minutes: 6
        run: |
          export DEBIAN_FRONTEND=noninteractive
          cat > /etc/apt/apt.conf.d/99ci-network <<'EOF'
          Acquire::ForceIPv4 "true";
          Acquire::Retries "5";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$f" ]; then
              sed -i -E \
                -e 's|https?://([a-z0-9-]+\.)?archive\.ubuntu\.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' \
                -e 's|https?://security\.ubuntu\.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' \
                "$f"
            fi
          done
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git xz-utils python3 g++ ninja-build \
            g++-mingw-w64-x86-64-win32 gcc-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64 \
            glslang-tools spirv-tools libvulkan-dev libexpat1

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Mesa 26.3.0 & libdrm build artifacts
        id: mesa-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/openrr-ci
            ~/src/mesa-deps
            ~/work/openrr-mesa-263-comparison
          key: ubuntu2604-mesa263-v6-${{ hashFiles('asi/build/mesa/capture.patch', 'asi/build/mesa/global-address.patch', 'asi/build/mesa/prepare_capture.py', 'asi/build/mesa/prepare_global_address.py', 'asi/build/mesa/build_capture_263.sh', 'asi/build/ci/prepare_ci_deps.sh') }}
          restore-keys: |
            ubuntu2604-mesa263-v6-
            ubuntu2604-mesa263-v5-

      - name: Install cold-build dependencies (on cache miss)
        env:
          OPENRR_CJK_FONT_URL: ${{ vars.OPENRR_CJK_FONT_URL }}
        run: |
          extra_pkgs=()
          font_cache="$HOME/.cache/openrr-ci/NotoSansCJKsc-Regular.ttf"
          if [ ! -f "$font_cache" ] || [ "$(wc -c < "$font_cache")" -le 5242880 ]; then
            if [ -n "${OPENRR_CJK_FONT_URL:-}" ]; then
              extra_pkgs+=(curl)
            else
              extra_pkgs+=(fonts-noto-cjk python3-fonttools)
            fi
          fi
          mesa_work="$HOME/work/openrr-mesa-263-comparison"
          if [ "${{ steps.mesa-cache.outputs.cache-hit }}" != "true" ] || \
             [ ! -f "$HOME/src/mesa-deps/lib/x86_64-linux-gnu/pkgconfig/libdrm_amdgpu.pc" ] || \
             [ ! -f "$mesa_work/build/src/amd/vulkan/libvulkan_radeon.so" ] || \
             [ ! -f "$mesa_work/build/src/amd/drm-shim/libamdgpu_noop_drm_shim.so" ] || \
             [ ! -f "$mesa_work/.openrr-patched.sha256" ]; then
            extra_pkgs+=(curl pkg-config meson bison flex python3-mako python3-yaml python3-packaging zlib1g-dev libzstd-dev libexpat1-dev)
          fi
          if [ "${#extra_pkgs[@]}" -gt 0 ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y --no-install-recommends "${extra_pkgs[@]}"
          fi
          rm -rf /var/lib/apt/lists/*

      - name: Prepare CI dependencies (Mesa 26.3.0, libdrm, CJK font)
        env:
          OPENRR_CJK_FONT_URL: ${{ vars.OPENRR_CJK_FONT_URL }}
        run: bash asi/build/ci/prepare_ci_deps.sh

      - name: Build OpenRR ASI, offline ACO records & release zip
        env:
          OPENRR_CLEAN_STAGE: '1'
          OPENRR_BUILD_ACO: '1'
          OPENRR_PACKAGE_ZIP: '1'
          OPENRR_PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          export OPENRR_MESA_263_TARBALL="$HOME/.cache/openrr-ci/mesa-26.3.0.tar.xz"
          bash asi/build/build_asi.sh build/asi

      - name: Validate all SPIR-V shaders & Python unit tests
        run: |
          set -euo pipefail
          printf '%s\0' build/asi/stage/openrr-amd/shaders/*.spv build/asi/stage/openrr-amd/shaders-gfx11/*.spv | \
            xargs -0 -n 1 -P "${OPENRR_BUILD_JOBS:-4}" spirv-val --scalar-block-layout
          python3 -m unittest discover -s asi/tests -p "test_*.py" -v

      - name: Upload release package artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenRR-OptiScaler-Package
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload separated debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: OpenRR-Debug-Symbols
          path: build/asi/openrr-amd.debug
          if-no-files-found: error
          retention-days: 30

  github-release:
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packaged release artifacts
        uses: actions/download-artifact@v8
        with:
          name: OpenRR-OptiScaler-Package
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: OpenRR ${{ github.ref_name }} (OptiScaler Plugin)
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          prerelease: true
